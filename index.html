<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>Parsa Mehri | کارت ویزیت دیجیتال</title>
<style>
:root{color-scheme:dark;--bg:#050b14;--panel:#0c1929;--blue:#168cff;--cyan:#55c7ff;--muted:#9eb3ca}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#102c4d 0%,#071321 42%,#040811 100%);font-family:Tahoma,Arial,sans-serif;color:#f4f8ff}
.card{width:min(100%,420px);padding:34px 25px 27px;border:1px solid #1d4265;border-radius:28px;background:linear-gradient(155deg,rgba(17,39,63,.96),rgba(7,16,29,.98));box-shadow:0 24px 80px #0009,0 0 40px #0879e51c;text-align:center;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;inset:0 18% auto;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent)}
.logo{width:94px;height:94px;margin:0 auto 20px;border-radius:28px;display:grid;place-items:center;background:linear-gradient(145deg,#168cff,#073d79);box-shadow:0 10px 35px #087be766;border:1px solid #69c8ff66;font-size:32px;font-weight:800;letter-spacing:1px}
h1{font-size:27px;margin:0 0 8px;letter-spacing:.3px}
.subtitle{margin:0 0 28px;color:var(--muted);font-size:13px}
.links{display:grid;gap:12px}
.link{display:flex;align-items:center;gap:14px;padding:16px 17px;border-radius:17px;text-decoration:none;color:#f4f8ff;text-align:right;background:linear-gradient(110deg,#102943,#0b1b2d);border:1px solid #244b70;transition:.2s}
.link:hover{transform:translateY(-2px);border-color:#4ab7ff;box-shadow:0 8px 25px #008cff20}
.icon{width:43px;height:43px;display:grid;place-items:center;border-radius:13px;background:#123b62;color:#69caff;flex:none}
.icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.text{display:grid;gap:5px;flex:1;min-width:0}
.label{font-size:14px;font-weight:700}
.value{font-size:12px;color:#a9c4df;direction:ltr;text-align:right;overflow-wrap:anywhere}
.arrow{color:#66c8ff;font-size:21px}
.footer{margin:25px 0 0;color:#7893ae;font-size:11px}
@media(prefers-reduced-motion:reduce){.link{transition:none}}
</style>
</head>
<body>
<main class="card">
  <div class="logo" aria-hidden="true">PM</div>
  <h1>Parsa Mehri</h1>
  <p class="subtitle">کارت ویزیت دیجیتال من</p>
  <nav class="links" aria-label="راه‌های ارتباطی">
    <a class="link" href="https://www.instagram.com/parsa_iran14/" target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></svg></span>
      <span class="text"><span class="label">پیج اینستاگرام</span><span class="value">@parsa_iran14</span></span>
      <span class="arrow" aria-hidden="true">←</span>
    </a>
    <a class="link" href="tel:+989100088271">
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a15 15 0 0 0 5 5L15 13l5 2v4c0 1.1-.9 2-2 2C9.7 21 3 14.3 3 6c0-1.1.9-2 2-2Z"/></svg></span>
      <span class="text"><span class="label">شماره تماس</span><span class="value">0910 008 8271</span></span>
      <span class="arrow" aria-hidden="true">←</span>
    </a>
  </nav>
  <p class="footer">خوشحال می‌شوم با من در ارتباط باشید</p>
</main>
</body>
</html>
